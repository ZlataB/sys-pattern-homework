---
- name: Change system MOTD greeting using variable
  hosts: all
  become: true
  vars:
    custom_motd: "Welcome to Netology DevOps DevOps environment!\n"
  tasks:
    - name: Update /etc/motd file
      ansible.builtin.copy:
        content: "{{ custom_motd }}"
        dest: /etc/motd
        mode: '0644'
